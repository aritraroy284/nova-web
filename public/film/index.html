<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NOVA AI — Kinetic Product Film</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: #04080E;
  --fg: #E6F7FB;
  --acc: #00E5FF;
  --warn: #FFB300;
  --danger: #FF3D6E;
  --mint: #00F5A0;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.st {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: #04080E;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}
#playOverlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: radial-gradient(circle at center, rgba(6,11,17,0.35) 0%, rgba(4,8,14,0.82) 100%);
  backdrop-filter: blur(6px);
  cursor: pointer;
  z-index: 40;
  transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
}
#playOverlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.playBtn, .playBtn *, .playCaption { pointer-events: none; }
.playBtn {
  position: relative;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  border: 1.5px solid rgba(0, 229, 255, 0.75);
  background: rgba(0, 229, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 40px rgba(0, 229, 255, 0.35), inset 0 0 20px rgba(0, 229, 255, 0.15);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background 0.25s, box-shadow 0.25s;
}
.playBtn::before {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px dashed rgba(0, 229, 255, 0.4);
  animation: spinRing 10s linear infinite;
}
@keyframes spinRing {
  to { transform: rotate(360deg); }
}
.playBtn:hover {
  transform: scale(1.08);
  background: rgba(0, 229, 255, 0.22);
  box-shadow: 0 0 55px rgba(0, 229, 255, 0.6);
}
.playBtn svg {
  fill: #00E5FF;
  margin-left: 4px;
  filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.8));
}
.playCaption {
  font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.2em;
  color: #00E5FF;
  text-transform: uppercase;
  opacity: 0.85;
}
.hudOverlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 14px 18px;
  z-index: 100;
  opacity: 1;
  transition: opacity 0.4s ease;
}
.hudOverlay.fade {
  opacity: 0;
}
.hudTop {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  pointer-events: auto;
}
.hudBtn {
  background: rgba(8, 16, 26, 0.72);
  border: 1px solid rgba(0, 229, 255, 0.35);
  color: #00E5FF;
  border-radius: 999px;
  padding: 6px 13px;
  font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.1em;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: all 0.2s ease;
}
.hudBtn:hover {
  background: rgba(0, 229, 255, 0.18);
  border-color: #00E5FF;
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.25);
}
.hudBottom {
  width: 100%;
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.barWrap {
  position: relative;
  flex: 1;
  height: 5px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 3px;
  cursor: pointer;
  overflow: hidden;
}
.barFill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  background: linear-gradient(90deg, #00E5FF, #00F5A0, #FFB300);
  width: 0%;
  box-shadow: 0 0 12px #00E5FF;
}
.timeLabel {
  font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: #8CA4B5;
  min-width: 72px;
  text-align: right;
}
</style>
</head>
<body>
<div class="st" id="stage">
  <canvas id="cv"></canvas>
  <div id="playOverlay" onclick="startFilm()" style="z-index: 40; cursor: pointer;">
    <div class="playBtn">
      <svg width="28" height="28" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="playCaption">INITIALIZE KINETIC FILM // 70S</div>
  </div>
  <div class="hudOverlay" id="hud">
    <div class="hudTop">
      <button class="hudBtn" id="au">AUDIO: ON</button>
      <button class="hudBtn" id="rp">↺ REPLAY</button>
      <button class="hudBtn" id="fs">⛶ FULL</button>
    </div>
    <div class="hudBottom">
      <div class="barWrap" id="barWrap"><div class="barFill" id="barFill"></div></div>
      <div class="timeLabel" id="tm">0.0 / 70.0</div>
    </div>
  </div>
</div>

<audio id="studioAudio" preload="auto">
  <source src="/audio/nova_vo.mp3" type="audio/mpeg">
  <source src="./nova_vo.mp3" type="audio/mpeg">
  <source src="nova_vo.mp3" type="audio/mpeg">
</audio>
<audio id="bgm" loop preload="auto">
  <source src="/audio/bgm.mp3" type="audio/mpeg">
  <source src="./bgm.mp3" type="audio/mpeg">
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<script>
const W = 1280, H = 720, DUR = 70;
const DISP = '"Inter", "Helvetica Neue", Arial, system-ui, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const studio = document.getElementById('studioAudio'), bgm = document.getElementById('bgm');

const SC = [
  ['HOOK', 0, 10],
  ['CORE', 10, 18],
  ['BRAIN', 18, 32],
  ['GHOST', 32, 48],
  ['VAULT', 48, 58],
  ['CLIMAX', 58, 70]
];

const LINES = [
  [0.4, 4.6, 'Another chatbot. Another *tab*. Another box that waits for you to type.'],
  [5.2, 9.6, 'Nova doesn’t wait. Nova *lives* on your phone — and acts on your world.'],
  [10.4, 15.8, 'Meet *NOVA*. Neural Operations and Virtual Automation. An operating layer, not an app.'],
  [18.4, 23.6, 'Every request hits a router in milliseconds. Gemini first. Then Groq for raw speed.'],
  [24.0, 31.4, 'OpenRouter for depth. One model stumbles — the signal just *reroutes*. Nova never goes dark.'],
  [32.4, 37.6, 'Now watch. No API. No tap. Nova looks at your screen… and understands it.'],
  [38.0, 43.4, 'It opens Spotify. Finds the track. Hits play. Reads your inbox out loud.'],
  [44.0, 47.6, '*Ghost Protocol*. Your phone, operated.'],
  [48.6, 53.6, 'Your keys never ride inside the app. They sync from a cryptographic vault — yours alone.'],
  [54.0, 57.6, 'Local-first. Locked down. *Yours*.'],
  [58.6, 63.0, 'This is *autonomous* intelligence — engineered for your *pocket*.'],
  [63.6, 69.4, 'NOVA AI. *Control that stays yours.*']
];

const BEATS = [0.4, 1.3, 4.7, 5.3, 7.6, 8.1, 10.4, 15.2, 18.4, 21.0, 23.4, 26.5, 27.6, 29.4, 32.4, 34.5, 38.6, 41.7, 42.9, 44.4, 48.6, 50.8, 52.1, 54.0, 55.5, 56.5, 58.6, 61.4, 61.9, 63.6, 66.6];
const CUTS = [10.0, 18.0, 32.0, 48.0, 53.9, 58.0, 63.4];

// Mathematical helpers
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ex = x => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.pow(2, -10 * x);
const eb = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const ic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const bz = (a, b, c, d) => x => {
  if (x <= 0 || x >= 1) return x;
  let lo = 0, hi = 1, t = x;
  for (let i = 0; i < 16; i++) {
    const u = 1 - t, xx = 3 * u * u * t * a + 3 * u * t * t * c + t * t * t;
    xx < x ? lo = t : hi = t;
    t = (lo + hi) / 2;
  }
  const u = 1 - t;
  return 3 * u * u * t * b + 3 * u * t * t * d + t * t * t;
};
const EASE_MAIN = bz(0.2, 0.9, 0.1, 1.0);
const rn = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

let BA = 1;
const A = x => ctx.globalAlpha = cl(BA * x);

function rRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}

// ---------------------------------------------------------
// MULTI-BAND WEB AUDIO SYNTHESIZER (SUB-BASS + CLICKS + WHOOSH)
// ---------------------------------------------------------
let T = 0, playing = false, last = 0, dirty = true, bi = 0, ci = 0, li = -1, AU = true, ac, noiseBuf, hasStudio = false, lastTick = 0;
const $ = id => document.getElementById(id);

studio.addEventListener('canplay', () => { hasStudio = true; });
studio.addEventListener('error', () => { hasStudio = false; });

function ensureAudio() {
  if (!AU) return null;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    return ac;
  } catch (e) { return null; }
}

function hit(weight = 1) {
  if (!AU) return;
  const ctxA = ensureAudio();
  if (!ctxA) return;
  try {
    const n = ctxA.currentTime;
    const o1 = ctxA.createOscillator(), o2 = ctxA.createOscillator(), g = ctxA.createGain();
    o1.type = 'sine';
    o2.type = 'triangle';
    o1.frequency.setValueAtTime(68 * weight, n);
    o1.frequency.exponentialRampToValueAtTime(26, n + 0.34);
    o2.frequency.setValueAtTime(130 * weight, n);
    o2.frequency.exponentialRampToValueAtTime(38, n + 0.22);

    g.gain.setValueAtTime(0.42 * weight, n);
    g.gain.exponentialRampToValueAtTime(0.001, n + 0.36);

    o1.connect(g);
    o2.connect(g);
    g.connect(ctxA.destination);
    o1.start(n); o2.start(n);
    o1.stop(n + 0.37); o2.stop(n + 0.37);

    if (noiseBuf) {
      const src = ctxA.createBufferSource(), flt = ctxA.createBiquadFilter(), ng = ctxA.createGain();
      src.buffer = noiseBuf;
      flt.type = 'bandpass';
      flt.frequency.setValueAtTime(1800, n);
      ng.gain.setValueAtTime(0.14 * weight, n);
      ng.gain.exponentialRampToValueAtTime(0.001, n + 0.035);
      src.connect(flt).connect(ng).connect(ctxA.destination);
      src.start(n); src.stop(n + 0.04);
    }
  } catch (e) {}
}

function tick(freq = 2600) {
  if (!AU) return;
  const now = performance.now();
  if (now - lastTick < 48) return;
  lastTick = now;
  const ctxA = ensureAudio();
  if (!ctxA || !noiseBuf) return;
  try {
    const n = ctxA.currentTime;
    const src = ctxA.createBufferSource(), flt = ctxA.createBiquadFilter(), g = ctxA.createGain();
    src.buffer = noiseBuf;
    flt.type = 'bandpass';
    flt.frequency.setValueAtTime(freq, n);
    flt.Q.setValueAtTime(6, n);
    g.gain.setValueAtTime(0.06, n);
    g.gain.exponentialRampToValueAtTime(0.001, n + 0.016);
    src.connect(flt).connect(g).connect(ctxA.destination);
    src.start(n);
    src.stop(n + 0.018);
  } catch (e) {}
}

function whoosh() {
  if (!AU) return;
  const ctxA = ensureAudio();
  if (!ctxA || !noiseBuf) return;
  try {
    const n = ctxA.currentTime;
    const src = ctxA.createBufferSource(), flt = ctxA.createBiquadFilter(), g = ctxA.createGain();
    src.buffer = noiseBuf;
    flt.type = 'bandpass';
    flt.Q.setValueAtTime(2.2, n);
    flt.frequency.setValueAtTime(220, n);
    flt.frequency.exponentialRampToValueAtTime(1900, n + 0.14);
    flt.frequency.exponentialRampToValueAtTime(280, n + 0.34);
    g.gain.setValueAtTime(0.01, n);
    g.gain.linearRampToValueAtTime(0.22, n + 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, n + 0.36);
    src.connect(flt).connect(g).connect(ctxA.destination);
    src.start(n);
    src.stop(n + 0.38);
  } catch (e) {}
}

function say(s) {
  if (!AU || hasStudio || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s.replace(/\*/g, ''));
    u.rate = 1.08;
    u.pitch = 0.94;
    const v = speechSynthesis.getVoices().find(v => /^en/i.test(v.lang) && /male|daniel|alex|david|guy|christopher/i.test(v.name));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------------------------------------------------------
// SPATIAL 2.5D CAMERA & PARALLAX MATRIX
// ---------------------------------------------------------
function getCameraState(t) {
  const bt = BEATS.filter(b => b <= t).pop() ?? -9;
  const dt = Math.max(0, t - bt);
  const shakeDecay = Math.exp(-dt * 18);
  const shakeX = (Math.sin(t * 190) * 8 + (rn(Math.floor(t * 60)) - 0.5) * 10) * shakeDecay;
  const shakeY = (Math.cos(t * 165) * 7 + (rn(Math.floor(t * 60) + 9) - 0.5) * 8) * shakeDecay;
  const shakeRot = Math.sin(t * 140) * 0.012 * shakeDecay;

  let cx = 0, cy = 0, cz = 1 + 0.06 * shakeDecay, pitch = 0, yaw = 0;
  if (t < 10) {
    cz += 0.05 * Math.sin(t * 0.5);
    yaw = 0.02 * Math.sin(t * 0.8);
  } else if (t < 18) {
    const l = t - 10;
    cz += 0.08 * ex(cl(l / 3));
    pitch = 0.025 * Math.cos(l * 0.6);
  } else if (t < 32) {
    const bad = t > 27.0 && t < 29.2;
    cx = bad ? 90 * ex(cl((t - 27) / 0.4)) : 35 * Math.sin(t * 0.4);
    cy = bad ? -35 : 12 * Math.cos(t * 0.5);
    cz += bad ? 0.10 : 0.03;
    yaw = bad ? -0.025 : 0.012 * Math.sin(t * 0.4);
  } else if (t < 48) {
    cx = 50 * Math.sin((t - 32) * 0.35);
    yaw = -0.024 * Math.sin((t - 32) * 0.4);
    pitch = 0.015 * Math.cos(t * 0.5);
  } else if (t < 58) {
    const lock = t > 50.8 && t < 53.5;
    cz += lock ? 0.12 * ex(cl((t - 50.8) / 0.6)) : 0.04;
  } else {
    cz += 0.08 * Math.sin((t - 58) * 0.4);
  }

  return {
    x: cx + shakeX,
    y: cy + shakeY,
    z: cz,
    rot: 0.008 * Math.sin(t * 0.45) + shakeRot,
    pitch,
    yaw,
    shake: shakeDecay
  };
}

function applyLayer(depth, cam) {
  const px = -cam.x * depth;
  const py = -cam.y * depth;
  const sc = 1 + (cam.z - 1) * depth;
  ctx.translate(W / 2 + px, H / 2 + py);
  ctx.rotate(cam.rot * depth);
  ctx.transform(sc, cam.pitch * depth * 0.3, cam.yaw * depth * 0.3, sc, 0, 0);
  ctx.translate(-W / 2, -H / 2);
}

// ---------------------------------------------------------
// TYPOGRAPHY & CHROMATIC SLAM HELPERS
// ---------------------------------------------------------
function tx(s, x, y, sz, col, o = {}) {
  ctx.save();
  ctx.translate(x, y);
  if (o.sc) ctx.scale(o.sc, o.sy || o.sc);
  A(o.a ?? 1);
  ctx.font = `${o.w || 900} ${sz}px ${o.f || DISP}`;
  ctx.textBaseline = 'middle';
  const tr = o.tr || 0, ch = [...s], ws = ch.map(c => ctx.measureText(c).width + tr);
  const tot = ws.reduce((a, b) => a + b, 0) - tr;
  let cx = o.al === 'l' ? 0 : o.al === 'r' ? -tot : -tot / 2;

  if (o.rgb && o.rgb > 0.02) {
    const off = o.rgb * 12;
    ctx.save();
    A((o.a ?? 1) * 0.7);
    ctx.fillStyle = '#00E5FF';
    let cx1 = cx - off;
    ch.forEach((c, i) => { ctx.fillText(c, cx1, -off * 0.2); cx1 += ws[i]; });
    ctx.fillStyle = '#FF2A6D';
    let cx2 = cx + off;
    ch.forEach((c, i) => { ctx.fillText(c, cx2, off * 0.2); cx2 += ws[i]; });
    ctx.restore();
  }

  ctx.fillStyle = ctx.strokeStyle = col;
  ctx.lineWidth = o.lw || 2;
  if (o.sh) { ctx.shadowColor = o.sh; ctx.shadowBlur = o.sb || 26; }
  ch.forEach((c, i) => {
    o.st ? ctx.strokeText(c, cx, 0) : ctx.fillText(c, cx, 0);
    cx += ws[i];
  });
  ctx.restore();
}

function slam(s, t, t0, t1, x, y, sz, col, o = {}) {
  const p = cl((t - t0) / 0.48);
  if (p <= 0) return;
  const q = ex(p);
  let a = cl(p * 5);
  if (t > t1) a *= 1 - cl((t - t1) / 0.28);
  if (a <= 0) return;
  const rgb = Math.max(0, 1 - p * 2.6);
  tx(s, x, y, sz, col, {
    ...o,
    a,
    rgb,
    sc: lerp(2.4, 1, q),
    sy: lerp(0.48, 1, q) * lerp(2.4, 1, q),
    tr: lerp(sz * 0.6, sz * 0.02, q)
  });

  if (p > 0.08 && p < 0.75 && sz >= 90) {
    const ba = (1 - (p - 0.08) / 0.67) * 0.5 * a;
    const bw = s.length * sz * 0.6, bh = sz * 0.95;
    const bx = o.al === 'l' ? x + bw / 2 : x;
    ctx.save();
    A(ba);
    ctx.strokeStyle = '#00E5FF';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.strokeRect(bx - bw / 2, y - bh / 2, bw, bh);
    ctx.setLineDash([]);
    ctx.fillStyle = '#FFB300';
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
      ctx.fillRect(bx + sx * bw / 2 - 3, y + sy * bh / 2 - 3, 6, 6);
    });
    ctx.font = `600 10px ${MONO}`;
    ctx.fillText(`KEY_SCALE: ${(lerp(2.4, 1, q)).toFixed(2)}x // LOCK`, bx - bw / 2 + 4, y - bh / 2 - 6);
    ctx.restore();
  }
}

const B = (p, u) => {
  const v = 1 - u;
  return [0, 1].map(k => v * v * v * p[0][k] + 3 * v * v * u * p[1][k] + 3 * v * u * u * p[2][k] + u * u * u * p[3][k]);
};

function pulse(P, t, t0, d, col = '#00E5FF') {
  const u = (t - t0) / d;
  if (u < 0 || u > 1.35) return;
  ctx.save();
  ctx.fillStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur = 14;
  for (let k = 0; k < 16; k++) {
    const q = u - k * 0.02;
    if (q < 0 || q > 1) continue;
    const [x, y] = B(P, q);
    A((1 - k / 16) * 0.95);
    ctx.beginPath();
    ctx.arc(x, y, 5.2 - k * 0.3, 0, 7);
    ctx.fill();
  }
  ctx.restore();
}

function curve(P, c = 'rgba(0,229,255,0.24)') {
  ctx.save();
  ctx.strokeStyle = c;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(...P[0]);
  ctx.bezierCurveTo(...P[1], ...P[2], ...P[3]);
  ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------
// LAYER 0: SPATIAL 3D PERSPECTIVE GRID & DEPTH FIELD
// ---------------------------------------------------------
function drawSpatialBackground(t, cam) {
  ctx.fillStyle = '#04080E';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  applyLayer(0.38, cam);

  ctx.strokeStyle = 'rgba(0, 229, 255, 0.045)';
  ctx.lineWidth = 1;
  const gs = 64;
  const ox = (t * 14) % gs;
  for (let x = -gs; x < W + gs; x += gs) {
    ctx.beginPath(); ctx.moveTo(x - ox, 0); ctx.lineTo(x - ox, H); ctx.stroke();
  }
  for (let y = -gs; y < H + gs; y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const hy = H * 0.61;
  let g = ctx.createRadialGradient(W / 2, hy, 0, W / 2, hy, 760);
  g.addColorStop(0, 'rgba(0, 229, 255, 0.16)');
  g.addColorStop(0.5, 'rgba(0, 120, 180, 0.05)');
  g.addColorStop(1, 'rgba(0, 229, 255, 0)');
  ctx.fillStyle = g;

  SC.forEach((s, i) => {
    if (t < s[1] || t > s[2] + 0.35) return;
    BA = (i ? cl((t - s[1]) / 0.35) : 1) * (t > s[2] ? 1 - (t - s[2]) / 0.35 : 1);
    ctx.save();
    A(1);
    F[i](t, t - s[1]);
    ctx.restore();
  });
  ctx.restore();

  ctx.save();
  BA = 1;
  applyLayer(1.08, cam);
  kin(t);
  ctx.restore();

  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.38, W / 2, H / 2, W * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(2,5,10,0.6)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(0, 229, 255, 0.018)';
  for (let y = 0; y < H; y += 4) {
    ctx.fillRect(0, y, W, 1);
  }

  [10, 18, 32, 48, 58].forEach(b => {
    const d = Math.abs(t - b);
    if (d < 0.32) {
      const p = 1 - d / 0.32;
      ctx.fillStyle = `rgba(0, 229, 255, ${0.5 * p})`;

      ctx.fillStyle = `rgba(0, 229, 255, ${0.08 * p})`;

    ctx.fillStyle = `rgba(255, 255, 255, ${0.75 * Math.exp(-(t - 63.4) * 6)})`;
    ctx.fillRect(0, 0, W, H);
  }

  cut(t);
  drawMotionHUD(t, sc, cam);
}

const hudEl = $('hud'), playOverlay = $('playOverlay'), barFill = $('barFill'), stage = $('stage'), barWrap = $('barWrap');
let hudTimer = null, bv = 0.38;

function resetHudTimer() {
  if (!hudEl) return;

function bgmCtl() {
  try {
    if (playing && AU) bgm.play().catch(() => {});
    else bgm.pause();

}

function duck() {
  try {
    const sp = LINES.some(q => T >= q[0] && T <= q[1]);
    let target = sp ? 0.08 : 0.36;
    if (T > 67.0) target *= Math.max(0, 1 - (T - 67.0) / 2.8);
    bv += (target - bv) * 0.14;
    bgm.volume = cl(bv);
  } catch (e) {}
} catch (e) {}
}

function seek(x) {
  T = cl(x, 0, DUR);
  bi = BEATS.filter(b => b <= T).length;
  ci = CUTS.filter(c => c <= T).length;
  li = -1;
  try { if (bgm.duration) bgm.currentTime = T % bgm.duration; } catch (e) {}
  if (hasStudio) {
    try { studio.currentTime = T; } catch (e) {}
  } else {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  }
  dirty = true;
}


function startFilm() {
  const ov = document.getElementById("playOverlay");
  if (ov) {
    ov.style.display = "none";
    ov.classList.add("hidden");
  }
  setPlay(true);
}
window.startFilm = startFilm;


window.addEventListener("message", function(e) {
  if (e.data === "PLAY" || (e.data && e.data.type === "PLAY")) {
    if (typeof startFilm === "function") startFilm();
    else setPlay(true);
  }
});

function setPlay(p) {
  playing = p;
  if (p && T >= DUR) seek(0);
  if (playOverlay) {
    if (p) playOverlay.classList.add("hidden");
    else playOverlay.classList.remove("hidden");
  }
  ensureAudio();
  bgmCtl();
  if (p) {
    try {
      if (AU) {
        studio.currentTime = T;
        const pr = studio.play();
        if (pr && pr.then) {
          pr.then(() => { hasStudio = true; }).catch(() => {});
        }
      }
    } catch (e) {}
  } else {
    try { studio.pause(); } catch (e) {}
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  }
  last = performance.now();
  resetHudTimer();
}

function loop(n) {
  if (playing) {
    if (hasStudio && !studio.paused) {
      T = studio.currentTime;
    } else {
      T += Math.min(0.1, (n - last) / 1000);
    }
    if (T >= DUR) {
      T = DUR;
      setPlay(false);
    }
    while (bi < BEATS.length && BEATS[bi] <= T) {
      hit(1.0);
      bi++;
    }
    while (ci < CUTS.length && CUTS[ci] <= T) {
      whoosh();
      ci++;
    }
    if (!hasStudio) {
      const q = LINES.findIndex(l => T >= l[0] && T < l[1]);
      if (q !== li) {
        li = q;
        if (q >= 0) say(LINES[q][2]);
      }
    }
    duck();
    dirty = true;
  }
  last = n;
  if (dirty) {
    draw(T);
    dirty = false;
    if (barFill) barFill.style.width = (T / DUR * 100) + '%';
    if ($('tm')) $('tm').textContent = T.toFixed(1) + ' / ' + DUR.toFixed(1);
  }
  requestAnimationFrame(loop);
}

function handleTrigger(e) {
  if (e) e.stopPropagation();
  if (playOverlay) {
    playOverlay.style.display = "none";
    playOverlay.classList.add("hidden");
  }
  setPlay(true);
}
playOverlay.addEventListener("click", handleTrigger);
playOverlay.addEventListener("touchend", handleTrigger);

if (barWrap) {
  barWrap.onclick = e => {
    e.stopPropagation();
    const rect = barWrap.getBoundingClientRect();
    const ratio = cl((e.clientX - rect.left) / rect.width);
    seek(ratio * DUR);
  };
}

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    setPlay(!playing);
  }
});

function fit() {
  const r = cv.parentElement.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * d);
  cv.height = Math.round(r.width * 9 / 16 * d);
  dirty = true;
}
addEventListener('resize', fit);
fit();
seek(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
